name: Validate one-click installer

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-one-click-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse one-click PowerShell entry points
        shell: powershell
        run: |
          foreach ($path in @(
            'OneClick-Install.ps1',
            'step1-installer/Start-Installer.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Validate root orchestration contract
        shell: powershell
        run: |
          # Avoid a non-ASCII filename literal in the PowerShell 5.1 runner
          # script. Identify the root launcher by the helper it invokes instead.
          $rootBat = Get-ChildItem -LiteralPath . -Filter '*.bat' -File |
            Where-Object { (Get-Content -LiteralPath $_.FullName -Raw).Contains('OneClick-Install.ps1') } |
            Select-Object -First 1
          if (-not $rootBat) {
            throw 'Root one-click BAT entry point is missing.'
          }

          $bat = Get-Content -LiteralPath $rootBat.FullName -Raw
          if (-not $bat.Contains('OneClick-Install.ps1')) {
            throw 'Root BAT must launch OneClick-Install.ps1.'
          }

          $root = Get-Content -LiteralPath 'OneClick-Install.ps1' -Raw
          foreach ($needle in @(
            'step1-installer\Start-Installer.ps1',
            '-AutoInstall -InstallRoot $installRoot',
            'step2-plugin-pack',
            'Install-Plugins-Safe.bat --no-pause',
            '$env:MINIMAX_H3_ROOT = $installRoot',
            'Get-LatestStep2Log',
            'Test-OneClickExistingInstallRoot',
            'Get-OneClickFixedDrives',
            '[IO.DriveType]::Fixed',
            'Multiple MiniMax H3 installations were detected',
            '[Windows.Forms.MessageBox]::Show'
          )) {
            if (-not $root.Contains($needle)) { throw "One-click orchestration contract is missing: $needle" }
          }

          $step1 = $root.IndexOf('-AutoInstall -InstallRoot $installRoot')
          $step2 = $root.IndexOf('Install-Plugins-Safe.bat --no-pause')
          $success = $root.IndexOf('$successTitle =')
          if ($step1 -lt 0 -or $step2 -lt 0 -or $success -lt 0 -or -not ($step1 -lt $step2 -and $step2 -lt $success)) {
            throw 'One-click order must be Step 1 -> Step 2 -> final success prompt.'
          }

          $step2Bat = Get-Content -LiteralPath 'step2-plugin-pack/Install-Plugins-Safe.bat' -Raw
          foreach ($needle in @(
            'if /I "%~1"=="--no-pause" set "NO_PAUSE=1"',
            'if "%NO_PAUSE%"=="0" pause'
          )) {
            if (-not $step2Bat.Contains($needle)) { throw "Step 2 unattended contract is missing: $needle" }
          }

      - name: Exercise safe install-root selection on Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'OneClick-Install.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { throw 'Could not parse OneClick-Install.ps1.' }

          foreach ($name in @('Test-OneClickExistingInstallRoot','Resolve-OneClickInstallRoot')) {
            $functionAst = $ast.FindAll({
              param($node)
              $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $name
            }, $true) | Select-Object -First 1
            if (-not $functionAst) { throw "Function was not found: $name" }
            Invoke-Expression $functionAst.Extent.Text
          }
          function Write-OneClickLog { param([string]$Message, [string]$Level = 'INFO') }

          function New-FakeDrive {
            param([string]$Name, [string]$Root, [int64]$Free)
            return [PSCustomObject]@{
              Name = $Name
              RootDirectory = [PSCustomObject]@{ FullName = $Root }
              AvailableFreeSpace = $Free
            }
          }
          function New-ValidInstall {
            param([string]$DriveRoot)
            $root = Join-Path $DriveRoot 'MiniMaxH3'
            New-Item -ItemType Directory -Force -Path (Join-Path $root 'ComfyUI') | Out-Null
            New-Item -ItemType Directory -Force -Path (Join-Path $root 'runtime\venv\Scripts') | Out-Null
            'x' | Set-Content -LiteralPath (Join-Path $root 'ComfyUI\main.py') -Encoding ASCII
            'x' | Set-Content -LiteralPath (Join-Path $root 'runtime\venv\Scripts\python.exe') -Encoding ASCII
            return [IO.Path]::GetFullPath($root)
          }

          $oldExplicit = $env:MINIMAX_H3_ROOT
          $env:MINIMAX_H3_ROOT = $null
          try {
            $work = Join-Path $env:RUNNER_TEMP 'minimax-root-selection'
            Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
            $cRoot = Join-Path $work 'C-drive'
            $dRoot = Join-Path $work 'D-drive'
            $eRoot = Join-Path $work 'E-drive'
            $fRoot = Join-Path $work 'F-drive'
            $local = Join-Path $work 'LocalAppData'
            foreach ($path in @($cRoot,$dRoot,$eRoot,$fRoot,$local)) { New-Item -ItemType Directory -Force -Path $path | Out-Null }

            $c = New-FakeDrive -Name 'C:\' -Root $cRoot -Free 900GB
            $d = New-FakeDrive -Name 'D:\' -Root $dRoot -Free 100GB
            $e = New-FakeDrive -Name 'E:\' -Root $eRoot -Free 200GB
            $f = New-FakeDrive -Name 'F:\' -Root $fRoot -Free 400GB

            # Existing E: installation must win even though D: exists.
            $expectedE = New-ValidInstall -DriveRoot $eRoot
            $actual = Resolve-OneClickInstallRoot -FixedDrives @($c,$d,$e) -SystemDriveRoot 'C:\' -LocalAppDataRoot $local
            if ([IO.Path]::GetFullPath($actual) -ne $expectedE) { throw "Existing E drive install was not selected: $actual" }

            # Two valid installations are ambiguous and must never be guessed.
            $null = New-ValidInstall -DriveRoot $dRoot
            $ambiguousRejected = $false
            try {
              $null = Resolve-OneClickInstallRoot -FixedDrives @($c,$d,$e) -SystemDriveRoot 'C:\' -LocalAppDataRoot $local
            } catch {
              if ($_.Exception.Message -like '*Multiple MiniMax H3 installations were detected*') { $ambiguousRejected = $true }
            }
            if (-not $ambiguousRejected) { throw 'Multiple existing installations were not rejected.' }

            Remove-Item -LiteralPath (Join-Path $dRoot 'MiniMaxH3') -Recurse -Force
            Remove-Item -LiteralPath (Join-Path $eRoot 'MiniMaxH3') -Recurse -Force

            # Fresh install with D: keeps the historical D: preference.
            $actual = Resolve-OneClickInstallRoot -FixedDrives @($c,$d,$e,$f) -SystemDriveRoot 'C:\' -LocalAppDataRoot $local
            $expected = Join-Path $dRoot 'MiniMaxH3'
            if ([IO.Path]::GetFullPath($actual) -ne [IO.Path]::GetFullPath($expected)) { throw "D drive fresh-install preference failed: $actual" }

            # Without D:, choose the roomiest fixed non-system disk (F: here).
            $actual = Resolve-OneClickInstallRoot -FixedDrives @($c,$e,$f) -SystemDriveRoot 'C:\' -LocalAppDataRoot $local
            $expected = Join-Path $fRoot 'MiniMaxH3'
            if ([IO.Path]::GetFullPath($actual) -ne [IO.Path]::GetFullPath($expected)) { throw "Non-system fresh-install selection failed: $actual" }

            # Only the system disk available -> LocalAppData fallback.
            $actual = Resolve-OneClickInstallRoot -FixedDrives @($c) -SystemDriveRoot 'C:\' -LocalAppDataRoot $local
            $expected = Join-Path $local 'MiniMaxH3'
            if ([IO.Path]::GetFullPath($actual) -ne [IO.Path]::GetFullPath($expected)) { throw "LocalAppData fallback failed: $actual" }

            # Explicit target always wins; Step 1 later applies the non-empty-folder safety guard.
            $explicit = Join-Path $work 'ExplicitTarget'
            $env:MINIMAX_H3_ROOT = $explicit
            $actual = Resolve-OneClickInstallRoot -FixedDrives @($c,$d,$e,$f) -SystemDriveRoot 'C:\' -LocalAppDataRoot $local
            if ([IO.Path]::GetFullPath($actual) -ne [IO.Path]::GetFullPath($explicit)) { throw "Explicit MINIMAX_H3_ROOT was not honored: $actual" }
          } finally {
            $env:MINIMAX_H3_ROOT = $oldExplicit
          }

          Write-Host "PowerShell $($PSVersionTable.PSVersion): safe install-root selection passed."

      - name: Validate Step 1 unattended patch contract
        shell: powershell
        run: |
          $step1 = Get-Content -LiteralPath 'step1-installer/Start-Installer.ps1' -Raw
          foreach ($needle in @(
            '[switch]$AutoInstall',
            '$script:OneClickAutoInstall',
            '$script:OneClickInstallRoot',
            '$script:OneClickExitCode = 20',
            '$script:OneClickExitCode = 21',
            '$script:OneClickExitCode = 1',
            '$script:ProfileConfirmed = $true',
            '$form.Add_Shown({',
            'Invoke-Install',
            '$form.Close()',
            'step1-oneclick-latest.log',
            'if ($script:OneClickAutoInstall) { exit [int]$script:OneClickExitCode }'
          )) {
            if (-not $step1.Contains($needle)) { throw "Step 1 unattended contract is missing: $needle" }
          }

          $source = Get-Content -LiteralPath 'step1-installer/Install-MiniMaxH3.ps1' -Raw
          foreach ($needle in @(
            'param([switch]$SelfTest)',
            '$txtPath.Text = $defaultDrive',
            'Resolve the failed checks before installing.',
            'The selected folder is not empty and is not marked as a MiniMax H3 installation.',
            'Installation completed successfully.',
            'Installation stopped:',
            '[void]$form.ShowDialog()'
          )) {
            if (-not $source.Contains($needle)) { throw "Step 1 source patch point is missing: $needle" }
          }
